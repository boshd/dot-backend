[project]
name = "benji-api"
version = "0.1.0"
description = "Channel-agnostic API for Benji."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "cryptography>=45,<51",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "openai>=2.0,<3.0",
    "pgvector>=0.4,<1.0",
    "phonenumbers>=9.0,<10.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "stytch>=13,<14",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1.0",
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benji_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
